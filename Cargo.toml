[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/questloom-core",
    "crates/questloom-store",
    "crates/questloom-mcp",
    "crates/questloom-ai",
    "crates/questloom-plugin-api",
    "crates/plugins/questloom-plugin-github",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
# keyring 4 が 1.88 を要求するため、それに合わせてある。
rust-version = "1.88"
license = "BSD-3-Clause"
authors = ["reanisz"]
repository = "https://github.com/reanisz/questloom"

[workspace.dependencies]
# workspace 内 crate
questloom-core = { path = "crates/questloom-core" }
questloom-store = { path = "crates/questloom-store" }
questloom-mcp = { path = "crates/questloom-mcp" }
questloom-ai = { path = "crates/questloom-ai" }
questloom-plugin-api = { path = "crates/questloom-plugin-api" }
questloom-plugin-github = { path = "crates/plugins/questloom-plugin-github" }

# 共通の外部依存(バージョンはここで一元管理する)
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
# keyring: シークレット(MCP トークン・プラグインの secret 項目)を OS の資格情報ストア
# (Windows では資格情報マネージャー)へ置くために使う。既定 feature の `v1` が
# プラットフォームごとの store を自動登録する。
keyring = "4"
reqwest = { version = "0.13", default-features = false }
# rmcp: MCP の公式 Rust SDK。既定 feature (base64 / macros / server) に加えて
# Streamable HTTP サーバー transport と JSON Schema 生成を有効にする。
rmcp = { version = "3.1", features = ["schemars", "transport-streamable-http-server"] }
rusqlite = { version = "0.40", features = ["bundled", "backup", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
strip = true
