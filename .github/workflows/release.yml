# リリースビルド。`v*` タグの push で NSIS インストーラをビルドし、GitHub Release に添付する。
#
# 手動実行 (workflow_dispatch) ではビルドと Actions の artifact アップロードまで行い、
# Release は作らない(ワークフロー自体の検証用)。
#
# 注意: コード署名はしていないため、配布物の初回実行時に SmartScreen 警告が出る。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust ツールチェーンを用意する
        uses: dtolnay/rust-toolchain@stable

      - name: cargo のキャッシュ
        uses: Swatinem/rust-cache@v2

      - name: Node を用意する
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 依存をインストールする
        run: npm ci
        working-directory: apps/desktop

      - name: リリースビルド (NSIS)
        run: npm run tauri build
        working-directory: apps/desktop

      # 手動実行でも成果物を確認できるよう、常に artifact として残す。
      - name: 成果物をアップロードする
        uses: actions/upload-artifact@v4
        with:
          name: questloom-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # タグ push のときだけ Release を作成(タグと同名。本文は自動生成のリリースノート)。
      - name: GitHub Release を作成する
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
          generate_release_notes: true
