[package]
name = "questloom-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "questloom デスクトップアプリ(Tauri v2 シェル)"

[lib]
# `_lib` サフィックスは bin 名との衝突を避けるために必要(Windows のみの問題)。
# https://github.com/rust-lang/cargo/issues/8519
name = "questloom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
questloom-core.workspace = true
questloom-store.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
