[package]
name = "questloom-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "questloom デスクトップアプリ(Tauri v2 シェル)"

[lib]
# `_lib` サフィックスは bin 名との衝突を避けるために必要(Windows のみの問題)。
# https://github.com/rust-lang/cargo/issues/8519
name = "questloom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
questloom-ai.workspace = true
questloom-core.workspace = true
questloom-mcp.workspace = true
questloom-store.workspace = true

# tray-icon: タスクトレイ常駐に必要。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
chrono.workspace = true
# keyring: シークレットを OS の資格情報ストアへ置く (crate::secrets)。
keyring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# url: プラグインの fetch 許可ドメイン判定 (plugin_host::is_fetch_allowed) の URL パースに使う。
url.workspace = true

[dev-dependencies]
# reqwest: tests/backend_e2e.rs が実アプリの MCP エンドポイントを HTTP で叩くのに使う。
reqwest.workspace = true
tempfile.workspace = true
